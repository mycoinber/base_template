name = "fastgen-gsc-agent"
main = "src/index.ts"
compatibility_date = "2026-06-15"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Set these per mini-site deployment.
# BACKEND_URL = "https://api.example.com"
# SITE_ID = "mongodb_website_id"
# GSC_AGENT_ID = "mongodb_gsc_agent_id"
# Optional: override default 14-day backfill window.
GSC_DAYS_BACK = "14"
